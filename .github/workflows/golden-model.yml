name: Golden Model Verification

on:
  push:
    paths:
      - 'python/**'
      - 'demo/**'
      - 'expected_outputs/**'
      - '.github/workflows/golden-model.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'demo/**'
      - 'expected_outputs/**'
  workflow_dispatch:

jobs:
  golden-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot committed golden vectors (EOL-normalized)
        run: |
          mkdir -p /tmp/committed_vectors
          for f in expected_outputs/*.txt; do
            sed 's/\r$//' "$f" > "/tmp/committed_vectors/$(basename "$f")"
          done
          echo "Snapshotted $(ls /tmp/committed_vectors | wc -l) committed vector files."

      - name: Regenerate all golden vectors
        run: |
          cd python
          python golden_model.py

      - name: Verify regenerated vectors match committed files (value-exact, EOL-normalized)
        run: |
          fail=0
          count=0
          total=0
          for f in expected_outputs/*.txt; do
            b=$(basename "$f")
            count=$((count+1))
            sed 's/\r$//' "$f" > /tmp/regen_check.txt
            total=$((total + $(wc -l < /tmp/regen_check.txt)))
            if ! diff -q "/tmp/committed_vectors/$b" /tmp/regen_check.txt > /dev/null 2>&1; then
              echo "MISMATCH: $b"
              diff "/tmp/committed_vectors/$b" /tmp/regen_check.txt | head -5
              fail=1
            fi
          done
          echo "Compared $count files / $total expected values."
          if [ "$fail" -ne 0 ]; then
            echo "::error::Golden vector regression FAILED - regenerated files differ from committed."
            exit 1
          fi
          echo "All golden vectors regenerate identically - the Python-golden contract is intact."

      - name: Edge-detection demo regression (bonus)
        run: |
          mkdir -p /tmp/committed_demo
          for f in demo/expected/*.txt; do
            sed 's/\r$//' "$f" > "/tmp/committed_demo/$(basename "$f")"
          done
          cd demo
          python edge_detection_demo.py
          cd ..
          fail=0
          for f in demo/expected/*.txt; do
            b=$(basename "$f")
            sed 's/\r$//' "$f" > /tmp/demo_regen.txt
            if ! diff -q "/tmp/committed_demo/$b" /tmp/demo_regen.txt > /dev/null 2>&1; then
              echo "MISMATCH: $b"
              diff "/tmp/committed_demo/$b" /tmp/demo_regen.txt | head -5
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Edge-detection demo regression FAILED."
            exit 1
          fi
          echo "Edge-detection demo outputs regenerate identically."

      - name: Summarize verification surface
        run: |
          echo "Golden vector files  : $(ls expected_outputs | wc -l)"
          echo "Total expected values: $(cat expected_outputs/*.txt | wc -l)"
          echo "Configurations       : 7 (N=3..7 x W=8/32/64, ReLU=0/1) x K=1..3"
